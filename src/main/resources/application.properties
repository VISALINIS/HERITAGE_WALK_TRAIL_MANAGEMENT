# ===================================================================
# HERITAGE WALK TRAIL MANAGEMENT & VISITOR FEEDBACK ANALYTICS
# Spring Boot Configuration
# ===================================================================

server.port=8080

# Default to dev profile (in-memory H2 with MySQL compatibility) if no profile is explicitly passed
spring.profiles.default=dev

# -------------------------------------------------------------------
# MySQL Database Configuration
# -------------------------------------------------------------------
# Defaults to localhost:3306/heritagewalk_db with createDatabaseIfNotExist=true
# Can be overridden via environment variables:
#   SPRING_DATASOURCE_URL
#   SPRING_DATASOURCE_USERNAME
#   SPRING_DATASOURCE_PASSWORD
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/heritagewalk_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -------------------------------------------------------------------
# JPA & Hibernate Settings
# -------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=true

# -------------------------------------------------------------------
# HTTP Session Management
# -------------------------------------------------------------------
server.servlet.session.timeout=2h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.name=HERITAGE_SESSION_ID

# -------------------------------------------------------------------
# Static Resources Configuration
# -------------------------------------------------------------------
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**

