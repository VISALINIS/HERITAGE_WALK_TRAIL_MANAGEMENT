# ===================================================================
# HERITAGE WALK - DEVELOPMENT / DEMO PROFILE
# Runs with MySQL compatibility mode for instant zero-config testing
# ===================================================================

spring.datasource.url=jdbc:h2:mem:heritagewalk_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=true

# H2 Console (Accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Session
server.servlet.session.timeout=2h
server.servlet.session.cookie.name=HERITAGE_SESSION_ID
