<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Submitted Feedback | Heritage Walk</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg heritage-navbar sticky-top">
        <div class="container">
            <a class="navbar-brand heritage-brand" href="/index.html">
                <i class="bi bi-bank2"></i> Heritage Walk
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNavbar">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4">
                    <li class="nav-item"><a class="nav-link" href="/index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="/pages/heritage.html">Heritage Sites</a></li>
                    <li class="nav-item"><a class="nav-link" href="/pages/trails.html">Walking Trails</a></li>
                </ul>
                <ul class="navbar-nav ms-auto align-items-center" id="navbar-auth-links">
                    <!-- Populated by auth.js -->
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="container my-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <nav aria-label="breadcrumb">
                    <a href="/pages/visitor-dashboard.html" class="text-decoration-none text-secondary small">
                        <i class="bi bi-arrow-left me-1"></i>Back to Visitor Dashboard
                    </a>
                </nav>
                <h3 class="fw-bold mb-0" style="font-family: Georgia, serif; color: var(--heritage-primary);">My Heritage Feedback History</h3>
            </div>
            <a href="/pages/feedback.html" class="btn btn-heritage-gold btn-sm">
                <i class="bi bi-plus-circle me-1"></i>Write New Feedback
            </a>
        </div>

        <div class="card border-0 shadow-sm rounded-4 bg-white overflow-hidden">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th style="width: 25%;">Heritage Site</th>
                            <th style="width: 15%;">Rating</th>
                            <th style="width: 40%;">Feedback / Comment</th>
                            <th style="width: 15%;">Submission Date</th>
                            <th style="width: 5%;"></th>
                        </tr>
                    </thead>
                    <tbody id="my-feedback-table-body">
                        <tr>
                            <td colspan="5" class="text-center py-4 text-muted">
                                <div class="spinner-border spinner-border-sm text-warning me-2"></div>Loading feedback history...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <footer class="heritage-footer mt-auto py-3 text-center">
        <div class="container">
            <p class="small text-muted mb-0">&copy; 2026 Heritage Walk Trail Management System</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/visitor-dashboard.js"></script>
</body>
</html>
