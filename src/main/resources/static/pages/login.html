<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Heritage Walk</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg heritage-navbar">
        <div class="container">
            <a class="navbar-brand heritage-brand" href="/index.html">
                <i class="bi bi-bank2"></i> Heritage Walk
            </a>
            <div class="ms-auto">
                <a href="/pages/register.html" class="btn btn-outline-secondary btn-sm">
                    <i class="bi bi-person-plus me-1"></i>New Visitor? Register
                </a>
            </div>
        </div>
    </nav>

    <!-- Login Card -->
    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-5">
                <div class="card border-0 shadow-lg rounded-4 p-4 p-md-5 bg-white">
                    <div class="text-center mb-4">
                        <div class="d-inline-flex align-items-center justify-content-center bg-primary bg-opacity-10 rounded-circle p-3 mb-2">
                            <i class="bi bi-shield-lock-fill fs-2 text-primary"></i>
                        </div>
                        <h3 class="fw-bold" style="font-family: Georgia, serif; color: var(--heritage-navy);">Account Sign In</h3>
                        <p class="text-muted small">Sign in to access your visitor profile, feedback history, or administrator dashboard.</p>
                    </div>

                    <div id="login-alert" class="alert d-none"></div>

                    <form id="login-form" novalidate>
                        <div class="mb-3">
                            <label for="email" class="form-label small fw-semibold text-secondary">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                                <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label small fw-semibold text-secondary">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                                <input type="password" class="form-control" id="password" placeholder="Enter your password" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-heritage-primary w-100 py-2 fw-semibold mb-3">
                            <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
                        </button>
                    </form>

                    <!-- Fast Demo Auto-fill Buttons for Evaluation -->
                    <div class="p-3 bg-light rounded-3 border mt-3">
                        <small class="fw-bold text-secondary d-block mb-2 text-center text-uppercase" style="letter-spacing: 0.5px;">
                            Quick Evaluation Credentials
                        </small>
                        <div class="d-grid gap-2">
                            <button type="button" class="btn btn-outline-danger btn-sm text-start d-flex justify-content-between align-items-center" onclick="fillCredentials('admin@heritagewalk.com', 'Admin@123')">
                                <span><i class="bi bi-shield-shaded me-1"></i>Fill Admin Account</span>
                                <small class="text-muted">admin@heritagewalk.com</small>
                            </button>
                            <button type="button" class="btn btn-outline-primary btn-sm text-start d-flex justify-content-between align-items-center" onclick="fillCredentials('visitor@heritagewalk.com', 'Visitor@123')">
                                <span><i class="bi bi-person me-1"></i>Fill Visitor Account</span>
                                <small class="text-muted">visitor@heritagewalk.com</small>
                            </button>
                        </div>
                    </div>

                    <div class="text-center mt-4 pt-3 border-top">
                        <small class="text-muted">Don't have an account? <a href="/pages/register.html" class="fw-bold text-decoration-none" style="color: var(--heritage-primary);">Register as a Visitor</a></small>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="heritage-footer mt-auto py-3 text-center">
        <div class="container">
            <p class="small text-muted mb-0">&copy; 2026 Heritage Walk Trail Management System</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/auth.js"></script>
    <script>
        function fillCredentials(email, pwd) {
            document.getElementById('email').value = email;
            document.getElementById('password').value = pwd;
        }
    </script>
</body>
</html>
