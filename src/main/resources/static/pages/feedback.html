<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Heritage Feedback | Heritage Walk</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg heritage-navbar sticky-top">
        <div class="container">
            <a class="navbar-brand heritage-brand" href="/index.html">
                <i class="bi bi-bank2"></i> Heritage Walk
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNavbar">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4">
                    <li class="nav-item"><a class="nav-link" href="/index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="/pages/heritage.html">Heritage Sites</a></li>
                    <li class="nav-item"><a class="nav-link" href="/pages/trails.html">Walking Trails</a></li>
                </ul>
                <ul class="navbar-nav ms-auto align-items-center" id="navbar-auth-links">
                    <!-- Populated by auth.js -->
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-lg-7" id="feedback-form-container">
                <div class="card border-0 shadow-lg rounded-4 p-4 p-md-5 bg-white">
                    <div class="text-center mb-4">
                        <div class="d-inline-flex align-items-center justify-content-center bg-warning bg-opacity-25 rounded-circle p-3 mb-2">
                            <i class="bi bi-star-fill fs-2 text-warning"></i>
                        </div>
                        <h3 class="fw-bold" style="font-family: Georgia, serif; color: var(--heritage-navy);">Share Visitor Feedback</h3>
                        <p class="text-muted small">Your ratings help preserve historical accuracy, enhance trails, and guide future visitors.</p>
                    </div>

                    <div id="feedback-alert" class="alert d-none"></div>

                    <form id="standalone-feedback-form">
                        <div class="mb-3">
                            <label for="feedback-site-select" class="form-label small fw-semibold text-secondary">Select Heritage Site</label>
                            <select id="feedback-site-select" class="form-select" required>
                                <option value="">-- Choose a Heritage Monument --</option>
                            </select>
                        </div>

                        <div class="text-center my-4 p-3 bg-light rounded-3 border">
                            <label class="form-label small fw-bold text-secondary d-block mb-1">Your Rating (1 to 5 Stars)</label>
                            <div class="star-rating-input">
                                <input type="radio" id="star5" name="rating" value="5"><label for="star5" title="5 stars"><i class="bi bi-star-fill"></i></label>
                                <input type="radio" id="star4" name="rating" value="4"><label for="star4" title="4 stars"><i class="bi bi-star-fill"></i></label>
                                <input type="radio" id="star3" name="rating" value="3"><label for="star3" title="3 stars"><i class="bi bi-star-fill"></i></label>
                                <input type="radio" id="star2" name="rating" value="2"><label for="star2" title="2 stars"><i class="bi bi-star-fill"></i></label>
                                <input type="radio" id="star1" name="rating" value="1"><label for="star1" title="1 star"><i class="bi bi-star-fill"></i></label>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="feedback-comment" class="form-label small fw-semibold text-secondary">Comments & Impressions</label>
                            <textarea id="feedback-comment" class="form-control" rows="4" placeholder="Tell us about the architecture, crowd levels, guide availability, preservation quality..." required></textarea>
                        </div>

                        <button type="submit" class="btn btn-heritage-primary w-100 py-2 fw-semibold">
                            <i class="bi bi-send me-2"></i>Submit Feedback
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <footer class="heritage-footer mt-auto py-3 text-center">
        <div class="container">
            <p class="small text-muted mb-0">&copy; 2026 Heritage Walk Trail Management System</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/feedback.js"></script>
</body>
</html>
