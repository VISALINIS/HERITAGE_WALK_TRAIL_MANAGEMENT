<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visitor Registration | Heritage Walk</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg heritage-navbar">
        <div class="container">
            <a class="navbar-brand heritage-brand" href="/index.html">
                <i class="bi bi-bank2"></i> Heritage Walk
            </a>
            <div class="ms-auto">
                <a href="/pages/login.html" class="btn btn-outline-secondary btn-sm">
                    <i class="bi bi-box-arrow-in-right me-1"></i>Already have an account? Sign In
                </a>
            </div>
        </div>
    </nav>

    <!-- Registration Card -->
    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-5">
                <div class="card border-0 shadow-lg rounded-4 p-4 p-md-5 bg-white">
                    <div class="text-center mb-4">
                        <div class="d-inline-flex align-items-center justify-content-center bg-warning bg-opacity-25 rounded-circle p-3 mb-2">
                            <i class="bi bi-person-plus-fill fs-2 text-warning"></i>
                        </div>
                        <h3 class="fw-bold" style="font-family: Georgia, serif; color: var(--heritage-navy);">Create Visitor Account</h3>
                        <p class="text-muted small">Join fellow heritage lovers to rate monuments, record feedback, and track curated walking trails.</p>
                    </div>

                    <div id="register-alert" class="alert d-none"></div>

                    <form id="register-form" novalidate>
                        <div class="mb-3">
                            <label for="name" class="form-label small fw-semibold text-secondary">Full Name</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                                <input type="text" class="form-control" id="name" placeholder="e.g., Alex Bennett" required minlength="2">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label small fw-semibold text-secondary">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                                <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label small fw-semibold text-secondary">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                                <input type="password" class="form-control" id="password" placeholder="At least 6 characters" required minlength="6">
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="confirmPassword" class="form-label small fw-semibold text-secondary">Confirm Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-shield-check"></i></span>
                                <input type="password" class="form-control" id="confirmPassword" placeholder="Re-type password" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-heritage-primary w-100 py-2 fw-semibold">
                            <i class="bi bi-person-check me-2"></i>Create Account
                        </button>
                    </form>

                    <div class="text-center mt-4 pt-3 border-top">
                        <small class="text-muted">Already registered? <a href="/pages/login.html" class="fw-bold text-decoration-none" style="color: var(--heritage-primary);">Log in here</a></small>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="heritage-footer mt-auto py-3 text-center">
        <div class="container">
            <p class="small text-muted mb-0">&copy; 2026 Heritage Walk Trail Management System</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/auth.js"></script>
</body>
</html>
